# Self-contained SnappyForms environment: Postgres + app + Playwright browser tests,
# all in containers. Nothing is installed on the host and this never touches the
# remote Neon database. Run it with:
#
#   docker compose up --build --exit-code-from pw-tests
#
# The process exits with the Playwright test's exit code (0 = all green).
# For just an interactive app (no tests): `docker compose up --build webapp`.
#
# NOTE: the secrets below are throwaway values for this local demo/test stack only.
# NOTE: the app service is named "webapp", not "app" — the ".app" TLD is HSTS-preloaded
# in Chromium, so a bare "app" hostname forces HTTPS and breaks the browser test.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snappyforms
      POSTGRES_PASSWORD: snappyforms
      POSTGRES_DB: snappyforms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snappyforms -d snappyforms"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  webapp:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.app
    environment:
      DATABASE_URL: postgresql://snappyforms:snappyforms@db:5432/snappyforms?schema=public
      SESSION_SECRET: c66052eed1f506e0abf2999babf5138a233eed0a3e99c335d71d280c0564eba3
      CASE_DATA_ENCRYPTION_KEY: 050c6f79864334c1bf7f6fb520489a89ac39f5a991956801bd21a12756ba5cb6
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      APP_BASE_URL: http://localhost:3000
      # This stack serves the production build over plain HTTP, so allow the
      # session cookie to be set without the Secure flag. Local/test only.
      INSECURE_HTTP_COOKIES: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000" # browse the app at http://localhost:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  pw-tests:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.pw
    environment:
      BASE_URL: http://webapp:3000
    depends_on:
      webapp:
        condition: service_healthy

  # The two demo user-story tests (participant logs a shift, authorizer scans the
  # QR and confirms it). Same image as pw-tests; run explicitly, e.g.
  #   docker compose up --build --exit-code-from demo-stories demo-stories
  # Screenshots of each stage are written to ./e2e/screenshots on the host.
  demo-stories:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.pw
    command: ["node", "e2e/demo-stories.mjs"]
    environment:
      BASE_URL: http://webapp:3000
      SHOT_DIR: /tests/screenshots
    volumes:
      - ./frontend/e2e/screenshots:/tests/screenshots
    depends_on:
      webapp:
        condition: service_healthy

  # The low-touch story: an org hosts a shift with a rotating QR and volunteers
  # scanning it get signed off on the spot. Run explicitly, e.g.
  #   docker compose up --build --exit-code-from shift-story shift-story
  shift-story:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.pw
    command: ["node", "e2e/shift-qr-story.mjs"]
    environment:
      BASE_URL: http://webapp:3000
      SHOT_DIR: /tests/screenshots
    volumes:
      - ./frontend/e2e/screenshots:/tests/screenshots
    depends_on:
      webapp:
        condition: service_healthy

  # The presentation walkthrough: Maya requests confirmation, Northside confirms
  # it, and Maya faxes the resulting PA 1895 to her caseworker. Run explicitly:
  #   docker compose up --build --exit-code-from maya-story maya-story
  maya-story:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.pw
    command: ["node", "e2e/maya-confirmation-story.mjs"]
    environment:
      BASE_URL: http://webapp:3000
      SHOT_DIR: /tests/screenshots
    volumes:
      - ./frontend/e2e/screenshots:/tests/screenshots
    depends_on:
      webapp:
        condition: service_healthy

  # The partner-facing video tour: the Maya walkthrough recorded as WebM + MP4
  # via shot-scraper's storyboard format. Run explicitly, against a FRESH stack
  # (the storyboard uses a fixed activity title, so a warm database stacks
  # duplicates and makes the queue scene ambiguous):
  #   docker compose down -v
  #   docker compose up --build --exit-code-from tour tour
  # Video and per-beat stills land in ./frontend/e2e/tours/output on the host.
  tour:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.video
    environment:
      BASE_URL: http://webapp:3000
      STORYBOARD: maya-confirmation.storyboard.yml
    volumes:
      - ./frontend/e2e/tours/output:/tours/output
    depends_on:
      webapp:
        condition: service_healthy

volumes:
  pgdata:
