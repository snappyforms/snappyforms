# Firebase App Hosting configuration for SnappyForms (Next.js 14 + Prisma/PostgreSQL).
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Prerequisites:
#   1. Create the secrets in Google Cloud Secret Manager and grant the App Hosting
#      backend access, e.g.:
#        firebase apphosting:secrets:set DATABASE_URL
#        firebase apphosting:secrets:set SESSION_SECRET
#        firebase apphosting:secrets:set CASE_DATA_ENCRYPTION_KEY
#   2. Migrations now run automatically at build time (scripts/migrate-on-build.mjs,
#      wired into `npm run build`). That needs MIGRATE_DATABASE_URL in Secret
#      Manager, set to Neon's DIRECT (non-pooled) URL:
#        firebase apphosting:secrets:set MIGRATE_DATABASE_URL
#      A failed migration fails the build, so a release can never reach users
#      ahead of its own schema. To go back to applying them by hand, drop the
#      secret — the build step no-ops when it is absent.
#   3. For serverless/Neon, point DATABASE_URL at a POOLED connection string so
#      multiple instances don't exhaust Postgres connections.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  # --- Secrets (resolved from Secret Manager, runtime only) ---
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
  - variable: CASE_DATA_ENCRYPTION_KEY
    secret: CASE_DATA_ENCRYPTION_KEY
    availability:
      - RUNTIME
  # Resend API key for the home-page sign-up email (src/lib/signupNotify.ts).
  # Create it BEFORE this config deploys, or the rollout fails:
  #   firebase apphosting:secrets:set RESEND_API_KEY
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # Direct (non-pooled) URL, used only by the build-time migration step. Kept
  # separate from DATABASE_URL because that one is pooled for the running app,
  # and PgBouncer's transaction mode breaks the lock `migrate deploy` takes.
  # BUILD only — the app itself must never open a direct connection.
  - variable: MIGRATE_DATABASE_URL
    secret: MIGRATE_DATABASE_URL
    availability:
      - BUILD

  # --- Plain config ---
  - variable: APP_BASE_URL
    value: https://snappyforms.org
    availability:
      - RUNTIME

  # Inbox that receives home-page sign-ups. Comma-separate for several.
  - variable: SIGNUP_NOTIFY_EMAIL
    value: hello@snappyforms.org
    availability:
      - RUNTIME

  # Demo-only features (seeded login buttons, /dev/inbox). Keep OFF in a real deploy.
  - variable: DEMO_MODE
    value: "true"
    availability:
      - RUNTIME

  # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it must be
  # available during BUILD (RUNTIME kept for parity).
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: "true"
    availability:
      - BUILD
      - RUNTIME
